<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estética-Maquiagem</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap"
        rel="stylesheet">
</head>
<body>
    <!--
        Cabeçalho do meu projeto:
        logo, título, menu e botão do menu hambúrguer.
    -->
    <header class="header">
        <!-- Container para organizar os elementos do cabeçalho -->
        <div class="centralizar-tudo">
            <!-- Logo -->
            <a href="#" class="logo">
                <img src="assets/logo.png" alt="Logo do Estética-Maquiagem">
            </a>
            <!-- Nome do projeto -->
            <h1>
                Estética<span>-Maquiagem</span>
            </h1>
            <!-- Menu de navegação -->
            <ul class="nav" id="nav">
                <li>
                    <a href="#">Início</a>
                </li>
                <li>
                    <a href="#">Recursos</a>
                </li>
                <li>
                    <a href="#">Sobre</a>
                </li>
            </ul>

            <!-- Botão do menu para telas pequenas -->
            <button class="hamburguer" id="btn-menu">☰</button>
        </div>

    </header>
    <!-- Arquivo JavaScript -->
    <script src="script.js"></script>

</body>
</html>
